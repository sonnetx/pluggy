<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pluggy — data generation</title>
<link rel="stylesheet" href="/theme.css">
<script src="/ui.js"></script>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <a class="brand" href="/"><span class="mark"></span><b>pluggy</b></a>
    <nav>
      <div class="side-group">Runs</div>
      <a class="side-item" href="/train">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        Training
      </a>
      <a class="side-item" href="/" aria-current="page">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/>
          <path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>
          <path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg>
        Data generation
      </a>
      <div class="side-group">On this page</div>
      <div id="sectionnav"></div>
    </nav>
    <div class="side-foot">
      <a class="side-item" href="https://docs.claude.com/en/docs/about-claude/models" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 015.5 4H10v16H5.5A1.5 1.5 0 014 18.5z"/>
          <path d="M20 5.5A1.5 1.5 0 0018.5 4H14v16h4.5a1.5 1.5 0 001.5-1.5z"/></svg>
        Documentation
      </a>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <div class="crumb">
        <b>pluggy</b>
        <span class="sep">/</span>
        <span class="chip">
          <svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 014.5 6h4l2 2.5h9A1.5 1.5 0 0121 10v8a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18z"/></svg>
          <span id="crumb_cfg">synth_pretrain</span>
        </span>
        <span class="mono-id" id="crumb_id">synth</span>
      </div>
      <div class="topbar-right">
        <button class="icon" id="themetoggle" type="button" aria-label="Toggle theme"></button>
      </div>
    </div>

    <div class="page">
      <div class="page-head">
        <div>
          <h1><span id="head_name">synth_pretrain</span>
            <span class="mono-id" id="head_docs">—</span></h1>
          <div class="meta">
            <span id="meta_model">claude-opus-5</span>
            <span class="sep">·</span>
            <span id="meta_out">data/synth_v0</span>
          </div>
        </div>
        <div class="page-actions">
          <span class="msg" id="msg"></span>
          <button id="save">Save config</button>
          <button id="run" class="primary">Generate</button>
        </div>
      </div>

      <div class="cards">

        <div class="card" data-section="Corpus">
          <div class="card-head"><h2>Corpus</h2>
            <div class="right"><span class="note" id="corpus_note">—</span></div>
          </div>
          <div class="card-body">
            <div class="field">
              <label for="domains">Seed domains <span class="hint">— one per line</span></label>
              <textarea id="domains" rows="8"></textarea>
            </div>
            <div class="row">
              <div class="field">
                <label for="subtopics">Subtopics per domain</label>
                <input type="number" id="subtopics" min="1" value="25">
              </div>
              <div class="field">
                <label for="docs_per_topic">Docs per topic</label>
                <input type="number" id="docs_per_topic" min="1" value="5">
              </div>
            </div>
          </div>
        </div>

        <div class="card" data-section="Styles">
          <div class="card-head"><h2>Document styles</h2>
            <div class="right"><span class="note" id="styles_note">—</span></div>
          </div>
          <div class="card-body checks" id="styles"></div>
        </div>

        <div class="card" data-section="Generation">
          <div class="card-head"><h2>Generation</h2>
            <div class="right"><span class="note" id="provider_note">xai api</span></div>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="field">
                <label for="provider">Provider</label>
                <select id="provider">
                  <option value="grok" selected>grok (xai)</option>
                  <option value="anthropic">anthropic</option>
                </select>
              </div>
              <div class="field">
                <label for="model">Model</label>
                <input type="text" id="model" value="grok-4">
              </div>
              <div class="field">
                <label for="seed">Seed</label>
                <input type="number" id="seed" value="0">
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="max_tokens">Max tokens per doc</label>
                <input type="number" id="max_tokens" min="256" value="4096">
              </div>
              <div class="field">
                <label for="concurrency">Concurrency</label>
                <input type="number" id="concurrency" min="1" value="8">
              </div>
              <div class="field" id="grok_opts">
                <label for="temperature">Temperature
                  <small>— grok only, blank = provider default</small></label>
                <input type="number" id="temperature" min="0" max="2" step="0.1" value="1.0">
              </div>
            </div>
            <div class="check" id="anthropic_opts">
              <input type="checkbox" id="fallbacks" checked>
              <label for="fallbacks">Refusal fallbacks
                <small>— anthropic only: retry safety declines on a fallback model, server-side</small></label>
            </div>
          </div>
        </div>

        <div class="card" data-section="Quality">
          <div class="card-head"><h2>Quality</h2>
            <div class="right">
              <div class="check" style="margin:0">
                <input type="checkbox" id="q_enabled" checked>
                <label for="q_enabled">Judge + refine</label>
              </div>
            </div>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="field">
                <label for="min_score">Min score <span class="hint">— keep ≥</span></label>
                <input type="number" id="min_score" min="1" max="10" value="7">
              </div>
              <div class="field">
                <label for="refine_min">Refine floor <span class="hint">— rewrite ≥</span></label>
                <input type="number" id="refine_min" min="1" max="10" value="5">
              </div>
              <div class="field">
                <label for="refine_rounds">Max rounds</label>
                <input type="number" id="refine_rounds" min="0" value="1">
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label for="ngram">Dedup shingle ngram</label>
                <input type="number" id="ngram" min="2" value="13">
              </div>
              <div class="field">
                <label for="jaccard">Jaccard threshold</label>
                <input type="number" id="jaccard" min="0.1" max="1" step="0.05" value="0.8">
              </div>
            </div>
          </div>
          <div class="cmd" id="q_note"></div>
        </div>

        <div class="card" data-section="Output">
          <div class="card-head"><h2>Output</h2>
            <div class="right">
              <div class="field" style="min-width:190px">
                <select id="cfg_load"><option value="">Load saved config…</option></select>
              </div>
            </div>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="field">
                <label for="out_dir">Output dir</label>
                <input type="text" id="out_dir" value="data/synth_v0">
              </div>
              <div class="field">
                <label for="shard_docs">Docs per shard</label>
                <input type="number" id="shard_docs" min="1" value="500">
              </div>
            </div>
            <div class="field">
              <label for="cfg_name">Config name <span class="hint">— configs/&lt;name&gt;.json</span></label>
              <input type="text" id="cfg_name" value="synth_pretrain">
            </div>
          </div>
          <div class="cmd" id="shardglob"></div>
        </div>

        <div class="card" data-section="Estimate">
          <div class="card-head"><h2>Estimate</h2>
            <span class="note">worst case, before dedup</span>
          </div>
          <div class="card-body flush">
            <table class="data">
              <thead><tr><th>Quantity</th><th class="num">Value</th></tr></thead>
              <tbody id="preview"></tbody>
            </table>
          </div>
        </div>

        <div class="card wide" data-section="Monitor">
          <div class="card-head"><h2>Run</h2>
            <div class="right">
              <span class="status"><span class="dot" id="dot"></span><span id="statline">idle</span></span>
              <button id="stop" disabled>Stop</button>
            </div>
          </div>
          <pre class="log" id="log">No run yet.</pre>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_DOMAINS = [
  "computer science and programming", "mathematics", "physics",
  "biology and medicine", "history", "economics and finance",
  "engineering", "linguistics and writing",
];
let STYLE_NAMES = [];

const MODEL_DEFAULTS = { grok: "grok-4", anthropic: "claude-opus-5" };

function buildConfig() {
  const domains = $("domains").value.split("\n").map(s => s.trim()).filter(Boolean);
  const styles = STYLE_NAMES.filter(s => $("style_" + s).checked);
  const provider = $("provider").value;
  const generation = {
    docs_per_topic: +$("docs_per_topic").value,
    styles: styles,
    max_tokens: +$("max_tokens").value,
    concurrency: +$("concurrency").value,
  };
  if (provider === "grok" && $("temperature").value !== "")
    generation.temperature = +$("temperature").value;
  const cfg = {
    provider: provider,
    model: $("model").value.trim(),
    seed: +$("seed").value,
    seed_domains: domains,
    taxonomy: { subtopics_per_domain: +$("subtopics").value },
    generation: generation,
    quality: {
      enabled: $("q_enabled").checked,
      min_score: +$("min_score").value,
      refine_min: +$("refine_min").value,
      max_refine_rounds: +$("refine_rounds").value,
    },
    dedup: { ngram: +$("ngram").value, jaccard_threshold: +$("jaccard").value },
    output: { dir: $("out_dir").value.trim(), shard_docs: +$("shard_docs").value },
  };
  if (provider === "anthropic") cfg.fallbacks = $("fallbacks").checked;
  return cfg;
}

function syncProvider(resetModel) {
  const provider = $("provider").value;
  $("grok_opts").style.display = provider === "grok" ? "" : "none";
  $("anthropic_opts").style.display = provider === "anthropic" ? "" : "none";
  // the card's corner note used to be a hard-coded "anthropic api"
  $("provider_note").textContent = provider === "grok" ? "xai api" : "anthropic api";
  const other = provider === "grok" ? "anthropic" : "grok";
  if (resetModel && (!$("model").value.trim() ||
      $("model").value.trim() === MODEL_DEFAULTS[other]))
    $("model").value = MODEL_DEFAULTS[provider];
}

function applyConfig(cfg) {
  $("domains").value = (cfg.seed_domains || []).join("\n");
  $("subtopics").value = cfg.taxonomy?.subtopics_per_domain ?? 25;
  const g = cfg.generation || {};
  $("docs_per_topic").value = g.docs_per_topic ?? 5;
  $("max_tokens").value = g.max_tokens ?? 4096;
  $("concurrency").value = g.concurrency ?? 8;
  STYLE_NAMES.forEach(s => $("style_" + s).checked = !g.styles || g.styles.includes(s));
  const model = cfg.model ?? "grok-4";
  $("provider").value = cfg.provider ?? (model.startsWith("grok") ? "grok" : "anthropic");
  $("model").value = model;
  $("temperature").value = g.temperature ?? "";
  syncProvider(false);
  $("seed").value = cfg.seed ?? 0;
  $("fallbacks").checked = cfg.fallbacks ?? true;
  const q = cfg.quality || {};
  $("q_enabled").checked = q.enabled ?? true;
  $("min_score").value = q.min_score ?? 7;
  $("refine_min").value = q.refine_min ?? 5;
  $("refine_rounds").value = q.max_refine_rounds ?? 1;
  const d = cfg.dedup || {};
  $("ngram").value = d.ngram ?? 13;
  $("jaccard").value = d.jaccard_threshold ?? 0.8;
  $("out_dir").value = cfg.output?.dir ?? "data/synth_v0";
  $("shard_docs").value = cfg.output?.shard_docs ?? 500;
  preview();
}

const compact = n =>
  n >= 1e6 ? (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + "M"
  : n >= 1e3 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + "k"
  : String(n);

function preview() {
  const cfg = buildConfig();
  const topics = cfg.seed_domains.length * cfg.taxonomy.subtopics_per_domain;
  const docs = topics * cfg.generation.docs_per_topic;
  const perDoc = 1 + (cfg.quality.enabled ? 1 + cfg.quality.max_refine_rounds : 0);
  const calls = cfg.seed_domains.length + docs * perDoc;
  const shards = Math.ceil(docs / Math.max(1, cfg.output.shard_docs));

  const rows = [
    ["Seed domains", cfg.seed_domains.length, ""],
    ["Topics", compact(topics), "domains × subtopics"],
    ["Documents", compact(docs), "topics × docs per topic"],
    ["Generated tokens", compact(docs * cfg.generation.max_tokens), "at the per-doc cap"],
    ["LLM calls", compact(calls), perDoc + " per doc + taxonomy"],
    ["Shards", shards, cfg.output.shard_docs + " docs each"],
  ];
  $("preview").innerHTML = rows.map(([k, v, sub]) =>
    `<tr><td class="key">${k}${sub ? `<small>${sub}</small>` : ""}</td>` +
    `<td class="num">${v}</td></tr>`).join("");

  const dir = cfg.output.dir || "data/synth_v0";
  $("shardglob").innerHTML =
    `train on this corpus by pointing <b>data.data_files</b> at <b>${dir}/shard-*.jsonl</b>`;
  $("q_note").textContent = cfg.quality.enabled
    ? `keep ≥ ${cfg.quality.min_score}/10; rewrite ${cfg.quality.refine_min}–`
      + `${cfg.quality.min_score - 1} up to ${cfg.quality.max_refine_rounds}×; `
      + `drop below ${cfg.quality.refine_min}. near-duplicates dropped above `
      + `${cfg.dedup.jaccard_threshold} jaccard.`
    : "judging off — every generated document is kept as written.";

  $("head_name").textContent = $("cfg_name").value || "untitled";
  $("head_docs").textContent = compact(docs) + " docs";
  $("crumb_cfg").textContent = $("cfg_name").value || "untitled";
  $("meta_model").textContent = cfg.model;
  $("meta_out").textContent = dir;
  $("corpus_note").textContent = compact(topics) + " topics";
  $("styles_note").textContent =
    STYLE_NAMES.length ? cfg.generation.styles.length + " of " + STYLE_NAMES.length : "—";
}

function msg(text, ok) {
  $("msg").textContent = text;
  $("msg").className = "msg " + (ok ? "ok" : "err");
}

async function api(path, body) {
  const resp = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || resp.statusText);
  return data;
}

async function save() {
  const data = await api("/api/config", { name: $("cfg_name").value, config: buildConfig() });
  msg("saved " + data.saved, true);
  loadMeta();
  return data;
}

async function poll() {
  const s = await api("/api/status");
  $("dot").className = "dot" + (s.running ? " on" : "");
  $("stop").disabled = !s.running;
  const p = s.progress || {};
  const bits = [];
  if (s.running) bits.push("running");
  else if (s.exit_code !== null && s.exit_code !== undefined)
    bits.push("finished (exit " + s.exit_code + ")");
  else bits.push("idle");
  if (p.topics) bits.push(p.topics + " topics");
  if (p.jobs_done !== undefined) bits.push(p.jobs_done + " jobs");
  if (p.shards !== undefined) bits.push(p.shards + " shards");
  if (p.manifest) bits.push(`kept ${p.manifest.kept} / dropped ${p.manifest.dropped} / dupes ${p.manifest.dupes}`);
  $("statline").textContent = bits.join("  ·  ");
  if (s.log_tail) {
    const log = $("log");
    const pinned = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
    log.textContent = s.log_tail;
    if (pinned) log.scrollTop = log.scrollHeight;
  }
}

async function loadMeta() {
  const meta = await api("/api/meta");
  if (!STYLE_NAMES.length) {
    STYLE_NAMES = Object.keys(meta.styles);
    $("styles").innerHTML = STYLE_NAMES.map(s =>
      `<div class="check"><input type="checkbox" id="style_${s}" checked>` +
      `<label for="style_${s}">${s} <small>— ${meta.styles[s]}</small></label></div>`).join("");
    document.querySelectorAll("#styles input").forEach(el => el.addEventListener("change", preview));
  }
  const sel = $("cfg_load");
  const current = sel.value;
  sel.innerHTML = '<option value="">Load saved config…</option>' +
    meta.configs.map(c => `<option>${c}</option>`).join("");
  sel.value = current;
}

$("save").onclick = () => save().catch(e => msg(e.message, false));
$("run").onclick = async () => {
  try {
    await save();
    const data = await api("/api/run", { name: $("cfg_name").value });
    msg("run started → " + data.log, true);
  } catch (e) { msg(e.message, false); }
};
$("stop").onclick = () => api("/api/stop", {}).then(() => msg("stop requested", true))
                                              .catch(e => msg(e.message, false));
$("cfg_load").onchange = async () => {
  const name = $("cfg_load").value;
  if (!name) return;
  try {
    applyConfig(await api("/api/config/" + name));
    $("cfg_name").value = name;
    msg("loaded " + name, true);
  } catch (e) { msg(e.message, false); }
};
document.querySelectorAll("input, textarea").forEach(el => el.addEventListener("input", preview));
$("provider").onchange = () => { syncProvider(true); preview(); };

$("domains").value = DEFAULT_DOMAINS.join("\n");
syncProvider(false);
loadMeta().then(preview).catch(e => msg(e.message, false));
setInterval(() => poll().catch(() => {}), 2000);
poll().catch(() => {});
</script>
</body>
</html>
