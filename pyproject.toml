[project]
name = "pluggy"
version = "0.1.0"
description = "training stack"
authors = [{name="giyushino", email="allanzhang440@gmail.com" }]

requires-python = "==3.14.*"
keywords = ["pytorch", "training"]

# i want minimal deps, but this will likely
# grow considerably in the future
# scalene -> for gpu + cpu profiling
dependencies = [
    "torch==2.10",
    "numpy==2.4.6",
    "tokenizers",
    "datasets",
    "torchdata",
]


[project.optional-dependencies]
wandb = ["wandb>=0.16"]
# synthetic data pipeline (pluggy/synth) -- the training stack never needs this
synth = ["anthropic>=0.90"]
# tests/ui_gutters.py drives headless chrome over the devtools protocol; it
# skips itself when this (or chrome) is missing
dev = ["websocket-client>=1.7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pluggy*"]

[tool.setuptools.package-data]
# the web ui (pages + stylesheet), served by pluggy/synth/server.py
"pluggy.synth" = ["static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# defaults (E4/E7/E9 pycodestyle errors + F pyflakes) plus B bugbear, which
# catches real bugs (mutable defaults, raise NotImplemented, silent zips).
# ratchet more rules in over time; don't add formatting churn retroactively.
extend-select = ["B"]

